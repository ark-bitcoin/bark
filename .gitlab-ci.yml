include:
  - local: '.gitlab/tests.yml'
  - local: '.gitlab/tests-codecov.yml'
  - local: '.gitlab/helpers.yml'
  - local: '.gitlab/master-release.yml'
  - local: '.gitlab/bark-release.yml'
  - local: '.gitlab/server-release.yml'
  - local: '.gitlab/nightly-release.yml'


variables:
  GIT_DEPTH: 100
  GIT_STRATEGY: clone
  NEXTEST_PROFILE: ci
  RUSTC_WRAPPER: sccache
  SCCACHE_MEMCACHED: tcp://memcached:11211
  SCCACHE_DIRECT: true
  CARGO_INCREMENTAL: 0
  # Normalize source paths in rustc metadata so the pre-built target/
  # from the base image (compiled under /home/nixuser/bark) is
  # fingerprint-compatible with what CI compiles under $CI_PROJECT_DIR.
  # Uses CARGO_BUILD_RUSTFLAGS rather than RUSTFLAGS so wasm builds still
  # pick up target.wasm32-unknown-unknown.rustflags from .cargo/config.toml.
  # Keep in sync with the ENV in .gitlab/images/tests/Dockerfile.
  CARGO_BUILD_RUSTFLAGS: "--remap-path-prefix=/builds/ark-bitcoin/bark=/build --remap-path-prefix=/home/nixuser/bark=/build"
  SWAGGER_UI_DOWNLOAD_URL: file:///home/nixuser/assets/swagger-ui/v5.30.2.zip

workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: none
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"
      variables:
        NEXTEST_PROFILE: ci-merge-train
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^bark-/
    - if: $CI_COMMIT_TAG =~ /^server-/
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PROJECT_URL == "https://gitlab.com/ark-bitcoin/bark"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - mirror
  - prechecks
  - check-commits
  - build
  - bark-test-builds
  - test
  - post-test
  - release
  - publish

# Specifying a default image for all steps. If you specify a new before_script in a step, then this will be ignored.
default:
  tags:
    - privileged
  image:
    name: registry.2nd.dev/build:34
    pull_policy: if-not-present
  before_script:
    - sudo chown -R nixuser:nixbld "$CI_PROJECT_DIR" || true
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - git config user.name "GitLab CI"
    - git config user.email "ci@second.tech"
    - |
      if [ -d /home/nixuser/bark/target ] && [ ! -e target ]; then
        echo "Linking bark target directory"
        ln -sfn /home/nixuser/bark/target target
      fi
