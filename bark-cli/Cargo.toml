[package]
name = "bark-cli"
version = "0.8.0"
edition = "2024"
license = "MIT"
description = "CLI for the bitcoin Ark protocol built by Second"
authors = [ "Team Second <hello@second.tech>" ]

[[bin]]
name = "bark"
path = "src/bin/bark-legacy/main.rs"

[[bin]]
name = "bark-cli"
path = "src/bin/bark-cli/main.rs"

[[bin]]
name = "bark-legacy"
path = "src/bin/bark-legacy/main.rs"

[[bin]]
name = "barkd"
path = "src/bin/barkd/main.rs"

[features]
default = ["tls-native-roots", "barkd-swagger-ui"]

# TLS certificate verification options (pick one). The bark-cli REST client
# verifies against the platform's certificate store under either option.
tls-native-roots = ["bark-wallet/tls-native-roots", "bark-server-rpc/tls-native-roots", "bark-rest-client/rustls-no-provider", "dep:rustls"]
# Use this feature for cross-compilation. It uses rustls with bundled Mozilla
# CA certificates instead of the system's native TLS and certificate store.
tls-webpki-roots = ["bark-wallet/tls-webpki-roots", "bark-server-rpc/tls-webpki-roots", "bark-rest-client/rustls-no-provider", "dep:rustls"]
# Compile SQLite from source instead of linking against the system library; useful for cross-compilation.
sqlite-bundled = ["bark-wallet/sqlite-bundled"]

barkd-swagger-ui = ["bark-rest/swagger-ui"]
# Embed and serve the bark-web SPA from barkd. Only embeds anything when the
# BARK_WEB_DIST env var points at a built bark-web distribution during the
# build; otherwise barkd serves no web UI. Off by default; release builds
# enable it (see nix/package-bark.nix).
barkd-web-ui = ["bark-rest/web-ui"]

[dependencies]
ark-lib = { version = "0.8.0", path = "../lib" }
bark-json = { version = "0.8.0", path = "../bark-json" }
bark-wallet = { version = "0.8.0", path = "../bark", default-features = false, features = [ "onchain-bdk", "sqlite", "filestore", "socks5-proxy", "rand", "native", "bitcoind-rpc" ] }
bark-bitcoin-ext = { version = "0.8.0", path = "../bitcoin-ext", features = ["rpc-socks5-proxy"] }
bark-server-rpc = { version = "0.8.0", path = "../server-rpc", default-features = false, features = ["tonic-native", "socks5-proxy"] }
bark-rest = { version = "0.8.0", path = "../bark-rest", default-features = false }
bark-rest-client = { version = "0.8.0", path = "../bark-rest-client", default-features = false }
reqwest = { version = "0.13", default-features = false }
# Without default features: rustls's defaults bring aws-lc next to bark's ring.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }

anyhow.workspace = true
bitcoin.workspace = true
bip39.workspace = true
clap.workspace = true
chrono.workspace = true
lazy_static.workspace = true
env_logger.workspace = true
lightning.workspace = true
lightning-invoice.workspace = true
lnurl-rs.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
tonic.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["macros", "fs", "signal", "rt-multi-thread"] }
tokio-util.workspace = true

dialoguer = "0.12"
home = "=0.5.9"

