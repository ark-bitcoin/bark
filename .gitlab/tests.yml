# Test pipeline - build and integration tests

.build-rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^bark-/
    - if: $CI_COMMIT_TAG =~ /^server-/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

.test-rules-no-tags:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

check-commits:
  interruptible: true
  stage: prechecks
  extends: .test-rules-no-tags
  needs:
    - prechecks
  script:
    - date +"%Y%m%d-%H%M%S" > RUN_DATETIME
    - git log --oneline -1
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        nix develop .#ci --command bash -c "just check-commits"
      else
        echo "Skipping check-commits for tag event"
      fi
    - git log --oneline -1
  artifacts:
    paths:
      - RUN_DATETIME
    expire_in: 1 day

build:
  interruptible: true
  stage: build
  extends: .build-rules
  needs:
    - prechecks
  script:
    - git log --oneline -1
    # Run stats query INSIDE the same shell that ran the build, so it hits
    # the same sccache binary/server that cargo actually invoked. If this
    # shows non-zero requests, the outer `sccache --show-stats` in
    # `after_script` is querying a different (freshly-started) sccache
    # instance — a display artifact, not a real "sccache did nothing".
    - nix develop .#ci --command bash -c "just build-ci && echo '=== sccache stats (inside .#ci) ===' && sccache --show-stats"
    # target/ is a symlink out of $CI_PROJECT_DIR when the base image
    # seeded it; GitLab's artifact uploader won't follow it. Materialize
    # just the declared artifacts under a real target/ inside the project.
    - |
      if [ -L target ]; then
        src="$(readlink target)/ci"
        rm target
        mkdir -p target/ci
        cp -aL "$src/captaind" "$src/watchmand" "$src/bark" "$src/barkd" target/ci/
        cp -aL "$src/examples" target/ci/
      fi
  artifacts:
    paths:
      - target/ci/examples/
      - target/ci/captaind
      - target/ci/watchmand
      - target/ci/bark
      - target/ci/barkd
    expire_in: 1 day

build-test-archives:
  interruptible: true
  stage: build
  extends: .test-rules-no-tags
  needs:
    - prechecks
  script:
    - git log --oneline -1
    # Stats query inside the same shell that ran the build, same reason as
    # in the `build` job — the outer sccache in `after_script` sees zero
    # because it's a different sccache instance.
    - nix develop .#ci --command bash -c "just build-unit-tests-ci && just build-integration-tests-ci && echo '=== sccache stats (inside .#ci) ===' && sccache --show-stats"
    # Same breakout as `build`: materialize the archives inside
    # $CI_PROJECT_DIR because GitLab won't follow the target symlink.
    - |
      if [ -L target ]; then
        src="$(readlink target)/ci"
        rm target
        mkdir -p target/ci
        cp -aL "$src/unit-tests.tar.zst" "$src/integration-tests.tar.zst" target/ci/
      fi
  artifacts:
    paths:
      - target/ci/unit-tests.tar.zst
      - target/ci/integration-tests.tar.zst
    expire_in: 1 day

compare-static-files:
  interruptible: true
  stage: test
  extends: .test-rules-no-tags
  needs:
    - build
  variables:
    ASSUME_BUILT: "1"
    EXAMPLES_DIR: target/ci/examples
  script:
    - nix develop .#ci --command bash -c "just generate-static-files"
    - bash contrib/check-clean-diff.sh bark/schema.sql
    - bash contrib/check-clean-diff.sh server/schema.sql
    - bash contrib/check-clean-diff.sh bark-rest/openapi.json
    - bash contrib/check-clean-diff.sh bark-rest-client/

