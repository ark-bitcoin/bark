# REMINDER: update `tar-and-print-test-data` job when adding/removing compat jobs
compat-bark-0.5.0:
  interruptible: true
  allow_failure: false
  stage: test
  tags:
    - integration
    - datastore
  extends: .test-rules-no-tags
  needs:
    - check-commits
    - build
    - build-test-archives
  variables:
    TEST_DIRECTORY: ./test/bark-0.5.0
    NEXTEST_TEST_THREADS: "4"
    BARK_COMMAND_TIMEOUT_MILLIS: "120000"
    TX_PROPAGATION_TIMEOUT: "30000"
    BARK_RELEASE_URL: https://gitlab.com/ark-bitcoin/bark/-/releases/bark-0.5.0/downloads/bark-0.5.0-linux-x86_64
    BARK_RELEASE_SHA256: b0d8c594d55eaf68f496208ae3cb8997302b3b4aa8c6821c0deca94b5a63c317
  cache:
    key: bark-0.5.0
    paths:
      - .bark-release-cache/
  script:
    - git log --oneline -1
    - export RUN_DATETIME=$(cat RUN_DATETIME)
    - export CAPTAIND_EXEC=${CI_PROJECT_DIR}/target/ci/captaind
    - export WATCHMAND_EXEC=${CI_PROJECT_DIR}/target/ci/watchmand
    - export BARKD_EXEC=${CI_PROJECT_DIR}/target/ci/barkd
    - >-
      export BARK_EXEC=$(python3 contrib/fetch-bark-release.py
      --url "$BARK_RELEASE_URL"
      --sha256 "$BARK_RELEASE_SHA256"
      --cache-dir "${CI_PROJECT_DIR}/.bark-release-cache")
    - bash ./contrib/ci-run-test.sh test-integration-bark-prebuilt

